<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Solid Navy Gradient -->
    <linearGradient id="dark-dash-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09101E"/>
      <stop offset="50%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#080E1B"/>
    </linearGradient>

    <!-- Restrained Radial Vignette -->
    <radialGradient id="top-glow-dash" cx="50%" cy="10%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.14"/>
      <stop offset="40%" stop-color="#0E1E38" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>

    <!-- Faint Peripheral Cyan Glow -->
    <radialGradient id="corner-cyan" cx="95%" cy="5%" r="35%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0"/>
    </radialGradient>

    <!-- Very Faint Skyline Fill -->
    <linearGradient id="skyline-faint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#15243B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0B1220" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- Base Fill -->
  <rect width="1920" height="1080" fill="url(#dark-dash-bg)"/>
  <rect width="1920" height="1080" fill="url(#top-glow-dash)"/>
  <rect width="1920" height="1080" fill="url(#corner-cyan)"/>

  <!-- Minimal Distant Skyline Contour (Lower Horizon, Very Faint) -->
  <path d="M 0 850 
           L 120 850 L 120 810 L 180 810 L 180 850 
           L 260 850 L 260 780 L 320 780 L 320 850
           L 440 850 L 440 820 L 510 820 L 510 850
           L 620 850 L 620 770 L 640 730 L 660 770 L 700 770 L 700 850
           L 820 850 L 820 805 L 890 805 L 890 850
           L 960 850
           L 1030 850 L 1030 800 L 1100 800 L 1100 850
           L 1220 850 L 1220 765 L 1280 765 L 1280 850
           L 1390 850 L 1390 815 L 1450 815 L 1450 850
           L 1560 850 L 1560 785 L 1620 785 L 1620 850
           L 1740 850 L 1740 810 L 1800 810 L 1800 850
           L 1920 850 L 1920 1080 L 0 1080 Z" 
        fill="url(#skyline-faint)"/>

  <!-- Faint Perspective Grid Ground (Bottom Area Only, Low Opacity) -->
  <g opacity="0.35">
    <line x1="960" y1="840" x2="300" y2="1080" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.12"/>
    <line x1="960" y1="840" x2="630" y2="1080" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.14"/>
    <line x1="960" y1="840" x2="960" y2="1080" stroke="#38BDF8" stroke-width="0.8" stroke-dasharray="10,14" stroke-opacity="0.14"/>
    <line x1="960" y1="840" x2="1290" y2="1080" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.14"/>
    <line x1="960" y1="840" x2="1620" y2="1080" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.12"/>

    <line x1="720" y1="910" x2="1200" y2="910" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.1"/>
    <line x1="530" y1="980" x2="1390" y2="980" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.12"/>
    <line x1="320" y1="1065" x2="1600" y2="1065" stroke="#38BDF8" stroke-width="0.7" stroke-opacity="0.14"/>
  </g>

  <!-- Whisper-Faint Ambient Traffic Traces (Periphery Only) -->
  <path d="M 0 1080 C 350 1020, 750 920, 960 840" fill="none" stroke="#06B6D4" stroke-width="1.2" stroke-opacity="0.12"/>
  <path d="M 1920 1080 C 1570 1020, 1170 920, 960 840" fill="none" stroke="#F59E0B" stroke-width="1.2" stroke-opacity="0.09"/>
</svg>
