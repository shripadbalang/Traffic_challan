<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Base Silver Pearl Gradient -->
    <linearGradient id="silver-base" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#F8FAFC"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E9EEF5"/>
    </linearGradient>

    <!-- Ambient Pale Blue Radiance -->
    <radialGradient id="pale-blue-glow" cx="80%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#DBEAFE" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#EFF6FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0"/>
    </radialGradient>

    <!-- Bottom Left Subtle Indigo Glow -->
    <radialGradient id="pale-slate-glow" cx="10%" cy="90%" r="45%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#F1F5F9" stop-opacity="0"/>
    </radialGradient>

    <!-- Silver Wave 1 Gradient -->
    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="45%" stop-color="#E2E8F0" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#DBEAFE" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Silver Wave 2 Gradient (Middle Depth) -->
    <linearGradient id="wave-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Silver Wave 3 Gradient (Bottom Sweep) -->
    <linearGradient id="wave-grad-3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#DBEAFE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Crisp Subtle Wave Stroke Gradient -->
    <linearGradient id="wave-line-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#CBD5E1" stop-opacity="0.1"/>
      <stop offset="35%" stop-color="#94A3B8" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#60A5FA" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="wave-line-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#CBD5E1" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- 1. Base Silver Gradient Background -->
  <rect width="1920" height="1080" fill="url(#silver-base)"/>

  <!-- 2. Atmospheric Radiance Overlays -->
  <rect width="1920" height="1080" fill="url(#pale-blue-glow)"/>
  <rect width="1920" height="1080" fill="url(#pale-slate-glow)"/>

  <!-- 3. Top Flowing Silver Wave (Graceful Arc) -->
  <path d="M -50 -20 
           C 420 180, 890 80, 1380 210 
           C 1680 290, 1850 160, 2000 120 
           L 2000 -20 Z" 
        fill="url(#wave-grad-1)"/>
  <path d="M -50 -20 
           C 420 180, 890 80, 1380 210 
           C 1680 290, 1850 160, 2000 120" 
        fill="none" stroke="url(#wave-line-1)" stroke-width="1.5"/>

  <!-- 4. Upper Secondary Wave Ribbon -->
  <path d="M -80 60 
           C 350 240, 780 150, 1220 280 
           C 1520 370, 1820 260, 2020 200 
           L 2020 -20 L -80 -20 Z" 
        fill="url(#wave-grad-2)" opacity="0.65"/>
  <path d="M -80 60 
           C 350 240, 780 150, 1220 280 
           C 1520 370, 1820 260, 2020 200" 
        fill="none" stroke="url(#wave-line-2)" stroke-width="1.2"/>

  <!-- 5. Lower Diagonal Silver Wave (Ground Balance) -->
  <path d="M -50 1100 
           C 380 920, 820 1020, 1280 880 
           C 1620 780, 1850 900, 2000 860 
           L 2000 1100 Z" 
        fill="url(#wave-grad-3)"/>
  <path d="M -50 1100 
           C 380 920, 820 1020, 1280 880 
           C 1620 780, 1850 900, 2000 860" 
        fill="none" stroke="url(#wave-line-1)" stroke-width="1.2"/>

  <!-- 6. Deep Lower Accent Wave -->
  <path d="M -20 1100 
           C 480 990, 950 1050, 1420 960 
           C 1720 900, 1880 970, 2000 950 
           L 2000 1100 Z" 
        fill="url(#wave-grad-2)" opacity="0.5"/>

  <!-- 7. Soft Ambient Ribbon Traces -->
  <path d="M 0 450 C 400 520, 900 380, 1400 480 C 1700 540, 1850 490, 1920 460" 
        fill="none" stroke="url(#wave-line-2)" stroke-width="0.8" opacity="0.45"/>
  <path d="M 0 490 C 420 560, 880 420, 1380 520 C 1680 580, 1840 530, 1920 500" 
        fill="none" stroke="url(#wave-line-1)" stroke-width="0.6" opacity="0.35"/>
</svg>
